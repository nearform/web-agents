<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Triage Eval</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #1a1a1a;
        --muted: #666;
        --line: #ddd;
        --good: #1b7f3b;
        --bad: #b42318;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --fg: #eee;
          --muted: #999;
          --line: #333;
          --good: #4cc274;
          --bad: #f97066;
        }
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.5 system-ui,
          sans-serif;
        margin: 0 auto;
        max-width: 1200px;
        padding: 16px;
      }
      p,
      li {
        color: var(--muted);
      }
      #strategies label {
        margin-right: 16px;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        margin-top: 16px;
        width: 100%;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 6px 8px;
        text-align: left;
        vertical-align: top;
      }
      td.good {
        color: var(--good);
      }
      td.bad {
        color: var(--bad);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Triage eval</h1>
    <p>
      <span id="count"></span> labelled follow-ups (● = observed in a real run).
      Each strategy decides research or reuse; cells show the verdict and
      p(research) where the strategy has one. Hover a cell for the reason and
      timing.
    </p>
    <ul id="status"></ul>
    <div id="strategies"></div>
    <p>
      <button id="run">Run</button>
      <button id="copy">Copy results JSON</button>
      <span id="progress"></span>
    </p>
    <ul id="summary"></ul>
    <div class="table-wrap"><table id="results"></table></div>
    <script type="module" src="./triage-eval.js"></script>
  </body>
</html>
